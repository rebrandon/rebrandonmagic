<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBrandon — Shiny Pokémon Hub & Bingo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        poke: {
                            dark: '#0f0f18',
                            card: '#181828',
                            border: '#2a2a48',
                            gold: '#ffd700',
                            sparkle: '#ffe066',
                            accent: '#7c3aed',
                            pink: '#ec4899',
                            blue: '#3b82f6'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        pixel: ['"Press Start 2P"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0f18;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            color: #f3f4f6;
        }

        .gold-glow {
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        .card-glow {
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
        }

        .bingo-tile {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bingo-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
        }

        .bingo-tile.completed {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.35) 0%, rgba(124, 58, 237, 0.45) 100%);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .bounce-sprite {
            animation: spriteFloat 3s ease-in-out infinite;
        }

        @keyframes spriteFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f18;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a48;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-poke-border/60 bg-poke-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-poke-gold via-poke-pink to-poke-accent flex items-center justify-center shadow-lg shadow-poke-accent/30">
                    <i class="fa-solid fa-sparkles text-poke-dark text-lg"></i>
                </div>
                <div>
                    <h1 class="font-pixel text-lg sm:text-xl text-white tracking-wider">ReBrandon<span class="text-poke-gold">.com</span></h1>
                    <p class="text-xs text-gray-400 font-medium">Shiny Pokémon Hunting Headquarters</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex space-x-1 sm:space-x-2 bg-poke-card/80 p-1.5 rounded-xl border border-poke-border">
                <button onclick="switchTab('bingo')" id="nav-bingo" class="nav-btn active px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 bg-poke-accent text-white shadow-md">
                    <i class="fa-solid fa-grid-2"></i>
                    <span>Bingo Race</span>
                </button>
                <button onclick="switchTab('counter')" id="nav-counter" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-calculator"></i>
                    <span>Encounter Counter</span>
                </button>
                <button onclick="switchTab('collection')" id="nav-collection" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-trophy"></i>
                    <span>Shiny Vault</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ================= SECTION 1: BINGO GENERATOR & TRACKER ================= -->
        <section id="section-bingo" class="space-y-6">
            <!-- Controls Bar -->
            <div class="bg-poke-card border border-poke-border rounded-2xl p-6 card-glow flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                    <label class="text-xs uppercase tracking-wider text-gray-400 font-bold">Seed:</label>
                    <div class="flex items-center w-full sm:w-auto">
                        <input type="text" id="seedInput" value="REBRANDON-2026" class="bg-poke-dark border border-poke-border text-poke-gold font-mono px-4 py-2 rounded-l-xl focus:outline-none focus:border-poke-accent w-full sm:w-48 text-sm">
                        <button onclick="generateBoardFromSeed()" class="bg-poke-accent hover:bg-poke-accent/80 px-4 py-2 rounded-r-xl text-white font-semibold text-sm transition">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                    </div>
                    <button onclick="randomizeSeed()" class="bg-poke-dark hover:bg-poke-border border border-poke-border px-3 py-2 rounded-xl text-xs font-semibold text-gray-300 transition">
                        Random
                    </button>
                </div>

                <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                    <button onclick="resetCurrentBoard()" class="px-4 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-semibold transition">
                        <i class="fa-solid fa-rotate-left mr-1.5"></i> Clear Marks
                    </button>
                    <button onclick="exportToObsidian()" class="px-4 py-2 rounded-xl bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 text-sm font-semibold transition">
                        <i class="fa-solid fa-file-export mr-1.5"></i> Obsidian Export
                    </button>
                </div>
            </div>

            <!-- Bingo Board Grid -->
            <div id="bingoGrid" class="grid grid-cols-5 gap-3 sm:gap-4 max-w-4xl mx-auto">
                <!-- Grid items generated dynamically by JavaScript -->
            </div>

            <!-- Board Stats & Win Banner -->
            <div id="winBanner" class="hidden bg-gradient-to-r from-poke-gold/20 via-poke-pink/20 to-poke-accent/20 border-2 border-poke-gold rounded-2xl p-6 text-center max-w-2xl mx-auto card-glow">
                <i class="fa-solid fa-crown text-4xl text-poke-gold mb-2 gold-glow"></i>
                <h2 class="font-pixel text-xl text-poke-gold mb-1">BINGO COMPLETED!</h2>
                <p class="text-gray-300 text-sm">Congratulations on finishing your shiny hunt bingo run!</p>
            </div>
        </section>


        <!-- ================= SECTION 2: ENCOUNTER COUNTER ================= -->
        <section id="section-counter" class="hidden space-y-6 max-w-3xl mx-auto">
            <div class
